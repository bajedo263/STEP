name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Le bundle publié sur Expo doit se construire (React 19.3 : un getServerSnapshot manquant ne
      # casse que l'export web, et donc la publication automatique après fusion).
      - run: npx expo export --platform all --output-dir dist
