name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ligues
      - name: Migration ligues sur une base PostGIS locale (bouchons Supabase)
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P <<'SQL'
          drop extension if exists postgis_tiger_geocoder cascade;
          drop extension if exists postgis_topology cascade;
          drop extension if exists postgis cascade;
          create schema extensions;
          create schema auth;
          create role authenticated; create role anon;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('test.uid', true), '')::uuid $$;
          grant usage on schema auth, public, extensions to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
          for f in supabase/migrations/*.sql; do echo "== $f"; $P -f "$f"; done
          echo "=== RÉSULTATS"
          $P <<'SQL'
          grant select, insert, update on all tables in schema public to authenticated;
          insert into auth.users select ('00000000-0000-0000-0000-00000000000' || c)::uuid from unnest(array['a','b','c','d','e','f','9']) c;
          update public.profiles set username = 'user' || right(id::text, 1);
          select public.league_week_start() as semaine;
          -- Semaine passée : groupe Argent de 6, A 50 000 ... F 0.
          insert into public.league_members (week, user_id, tier, group_no, joined_at)
          select public.league_week_start() - 7, ('00000000-0000-0000-0000-00000000000' || c)::uuid, 1, 1, now() - interval '8 days' + (i || ' seconds')::interval
          from unnest(array['a','b','c','d','e','f']) with ordinality as t(c, i);
          insert into public.daily_steps (user_id, day, steps)
          select ('00000000-0000-0000-0000-00000000000' || c)::uuid, public.league_week_start() - 5, s
          from unnest(array['a','b','c','d','e'], array[50000, 40000, 30000, 20000, 10000]) as t(c, s);
          insert into public.daily_steps (user_id, day, steps) values ('00000000-0000-0000-0000-00000000000a', public.league_week_start(), 7000), ('00000000-0000-0000-0000-00000000000e', public.league_week_start(), 9000);
          set role authenticated;
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000a', false);
          select username, steps, rank, is_me, tier, players, promote, demote, previous_tier from public.my_league();
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000c', false);
          select username, tier, players, previous_tier from public.my_league() where is_me;
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000e', false);
          select username, tier, players, previous_tier from public.my_league() where is_me;
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000f', false);
          select username, tier, players, previous_tier from public.my_league() where is_me;
          select set_config('test.uid', '00000000-0000-0000-0000-000000000009', false);
          select username, steps, rank, tier, players, previous_tier from public.my_league();
          select count(*) as lignes_visibles from public.league_members;
          reset role;
          -- Remplissage : 40 nouveaux au Bronze, groupes de 30 au plus.
          insert into auth.users select gen_random_uuid() from generate_series(1, 40);
          do $$ declare u uuid; begin
            for u in select id from auth.users where id not in (select user_id from public.league_members) loop
              perform set_config('test.uid', u::text, true);
              perform public.join_league();
            end loop;
          end $$;
          select tier, group_no, count(*) from public.league_members where week = public.league_week_start() group by 1, 2 order by 1, 2;
          SQL
