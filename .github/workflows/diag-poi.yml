name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saisons
      - name: Migration saisons sur une base PostGIS locale (bouchons Supabase)
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P <<'SQL'
          drop extension if exists postgis_tiger_geocoder cascade;
          drop extension if exists postgis_topology cascade;
          drop extension if exists postgis cascade;
          create schema extensions;
          create schema auth;
          create role authenticated; create role anon;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('test.uid', true), '')::uuid $$;
          grant usage on schema auth, public, extensions to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
          for f in supabase/migrations/*.sql; do echo "== $f"; $P -f "$f"; done
          echo "=== RÉSULTATS"
          $P <<'SQL'
          grant select, insert, update on all tables in schema public to authenticated;
          insert into auth.users values ('22222222-2222-2222-2222-222222222222'), ('33333333-3333-3333-3333-333333333333'), ('44444444-4444-4444-4444-444444444444');
          select now(), public.conquest_season_start(), public.conquest_since(), public.conquest_expires_at(public.conquest_season_start() - interval '1 day') as exp_fin_saison;
          -- Saison passée : Bob a 3 cases actives au dernier jour, Carol 2, Dan 1 trop ancienne.
          insert into public.conquest_cells (x, y, owner_id, captured_at) values
            (1, 1, '22222222-2222-2222-2222-222222222222', public.conquest_season_start() - interval '2 days'),
            (1, 2, '22222222-2222-2222-2222-222222222222', public.conquest_season_start() - interval '2 days'),
            (1, 3, '22222222-2222-2222-2222-222222222222', public.conquest_season_start() - interval '3 days'),
            (2, 1, '33333333-3333-3333-3333-333333333333', public.conquest_season_start() - interval '1 day'),
            (2, 2, '33333333-3333-3333-3333-333333333333', public.conquest_season_start() - interval '1 day'),
            (3, 1, '44444444-4444-4444-4444-444444444444', public.conquest_season_start() - interval '20 days');
          -- Cette saison : Carol conquiert une rue (déclenche l'archivage), Bob rien.
          insert into public.walks (user_id, mode, path, started_at, conquers) values ('33333333-3333-3333-3333-333333333333', 'free', 'SRID=4326;LINESTRING(2.3005 48.8495, 2.3141 48.8495)', now(), true);
          select * from public.conquest_seasons;
          select user_id, cells, rank from public.conquest_season_results order by rank;
          select count(*) filter (where captured_at > public.conquest_since()) as actives, count(*) as total from public.conquest_cells;
          set role authenticated;
          select set_config('test.uid', '22222222-2222-2222-2222-222222222222', false);
          select cells, rank, players, last_cells, last_rank, last_players, season_end - season_start as duree from public.my_conquest_season();
          select count(*) as resultats_visibles_bob from public.conquest_season_results;
          select set_config('test.uid', '33333333-3333-3333-3333-333333333333', false);
          select cells, rank, players, last_cells, last_rank, last_players from public.my_conquest_season();
          select kind, count(*) from public.my_territory_alerts() group by 1;
          SQL
