name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/territoire-vivant
      - name: Migration territoire vivant sur une base PostGIS locale (bouchons Supabase)
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P <<'SQL'
          drop extension if exists postgis_tiger_geocoder cascade;
          drop extension if exists postgis_topology cascade;
          drop extension if exists postgis cascade;
          create schema extensions;
          create schema auth;
          create role authenticated; create role anon;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('test.uid', true), '')::uuid $$;
          grant usage on schema auth, public, extensions to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
          for f in supabase/migrations/*.sql; do echo "== $f"; $P -f "$f"; done
          echo "=== RÉSULTATS"
          $P <<'SQL'
          grant select, insert, update on all tables in schema public to authenticated;
          insert into auth.users values ('22222222-2222-2222-2222-222222222222'), ('33333333-3333-3333-3333-333333333333');
          -- Bob conquiert une rue, Carol la croise : Bob perd les cases du croisement.
          insert into public.walks (user_id, mode, path, started_at, conquers) values ('22222222-2222-2222-2222-222222222222', 'free', 'SRID=4326;LINESTRING(2.3005 48.8495, 2.3141 48.8495)', now(), true);
          insert into public.walks (user_id, mode, path, started_at, conquers) values ('33333333-3333-3333-3333-333333333333', 'free', 'SRID=4326;LINESTRING(2.3100 48.8480, 2.3100 48.8530)', now(), true);
          select owner_id, count(*) from public.conquest_cells group by 1;
          select user_id, taken_by, count(*) as pertes from public.conquest_losses group by 1, 2;
          -- Une partie des cases de Bob a 6 jours (bientôt libérées), une autre 8 jours (déjà libres).
          update public.conquest_cells set captured_at = now() - interval '6 days' where owner_id = '22222222-2222-2222-2222-222222222222' and x < 265440;
          update public.conquest_cells set captured_at = now() - interval '8 days' where owner_id = '22222222-2222-2222-2222-222222222222' and x < 265420;
          set role authenticated;
          select set_config('test.uid', '22222222-2222-2222-2222-222222222222', false);
          select kind, count(*) from public.my_territory_alerts() group by 1 order by 1;
          select count(*) as pertes_lisibles from public.conquest_losses;
          select set_config('test.uid', '33333333-3333-3333-3333-333333333333', false);
          select kind, count(*) as alertes_carol from public.my_territory_alerts() group by 1 order by 1;
          reset role;
          -- Bob reprend sa rue : plus d'alerte « reprise » pour lui, Carol en a.
          insert into public.walks (user_id, mode, path, started_at, conquers) values ('22222222-2222-2222-2222-222222222222', 'free', 'SRID=4326;LINESTRING(2.3005 48.8495, 2.3141 48.8495)', now(), true);
          set role authenticated;
          select set_config('test.uid', '22222222-2222-2222-2222-222222222222', false);
          select kind, count(*) as apres_reprise_bob from public.my_territory_alerts() group by 1 order by 1;
          select set_config('test.uid', '33333333-3333-3333-3333-333333333333', false);
          select kind, count(*) as apres_reprise_carol from public.my_territory_alerts() group by 1 order by 1;
          SQL
