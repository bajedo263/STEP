name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/badges
      - name: Migration badges sur une base PostGIS locale (bouchons Supabase)
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P <<'SQL'
          drop extension if exists postgis_tiger_geocoder cascade;
          drop extension if exists postgis_topology cascade;
          drop extension if exists postgis cascade;
          create schema extensions;
          create schema auth;
          create role authenticated; create role anon;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('test.uid', true), '')::uuid $$;
          grant usage on schema auth, public, extensions to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
          for f in supabase/migrations/*.sql; do echo "== $f"; $P -f "$f"; done
          echo "=== RÉSULTATS"
          $P <<'SQL'
          grant select, insert, update on all tables in schema public to authenticated;
          insert into auth.users values ('22222222-2222-2222-2222-222222222222'), ('33333333-3333-3333-3333-333333333333');
          insert into public.walks (user_id, mode, path, started_at, distance_m) values ('22222222-2222-2222-2222-222222222222', 'free', 'SRID=4326;LINESTRING(2.3005 48.8495, 2.3141 48.8495)', now(), 1000), ('22222222-2222-2222-2222-222222222222', 'loop', null, now(), 2500), ('33333333-3333-3333-3333-333333333333', 'free', null, now(), 9000);
          set role authenticated;
          select set_config('test.uid', '22222222-2222-2222-2222-222222222222', false);
          select * from public.my_badge_stats();
          insert into public.challenge_completions (user_id, day, kind) values ('22222222-2222-2222-2222-222222222222', current_date, 'loop');
          insert into public.challenge_completions (user_id, day, kind) values ('22222222-2222-2222-2222-222222222222', current_date, 'loop') on conflict (user_id, day) do nothing;
          select * from public.my_badge_stats();
          select set_config('test.uid', '33333333-3333-3333-3333-333333333333', false);
          select * from public.my_badge_stats();
          select count(*) as defis_lisibles_par_carol from public.challenge_completions;
          do $$ begin
            insert into public.challenge_completions (user_id, day, kind) values ('22222222-2222-2222-2222-222222222222', current_date - 1, 'loop');
            raise notice 'ERREUR : Carol a écrit pour Bob';
          exception when others then raise notice 'OK refusé : %', sqlerrm; end $$;
          SQL
