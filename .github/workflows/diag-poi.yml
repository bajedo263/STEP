name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anecdote-lieu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anecdotes réelles
        run: |
          cat > /tmp/try.mts <<'TS'
          import { shortStory } from '/home/runner/work/STEP/STEP/src/lib/poi-story.ts';
          for (const t of ['Musée_Rodin', 'Rafle_du_Vélodrome_d\'Hiver', 'Mur_pour_la_Paix', 'Synagogue_Chasseloup-Laubat', 'Hôtel_de_Montesquiou', 'Square_Necker', 'Kinopanorama', 'Champ-de-Mars']) {
            const r = await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t), { headers: { 'Api-User-Agent': 'STEP/1.0 (https://github.com/bajedo263/step)' } });
            const j = await r.json();
            console.log('##', t, r.status, (j.extract ?? '').length, 'car.');
            console.log(shortStory(j.extract));
          }
          TS
          node --experimental-strip-types /tmp/try.mts
