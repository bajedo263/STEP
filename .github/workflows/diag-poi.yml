name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/amis-plus
      - name: Migration amis plus sur une base PostGIS locale (bouchons Supabase)
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P <<'SQL'
          drop extension if exists postgis_tiger_geocoder cascade;
          drop extension if exists postgis_topology cascade;
          drop extension if exists postgis cascade;
          create schema extensions;
          create schema auth;
          create role authenticated; create role anon;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('test.uid', true), '')::uuid $$;
          grant usage on schema auth, public, extensions to authenticated;
          grant execute on function auth.uid() to authenticated;
          SQL
          for f in supabase/migrations/*.sql; do echo "== $f"; $P -f "$f"; done
          echo "=== RÉSULTATS"
          $P <<'SQL'
          grant select, insert, update on all tables in schema public to authenticated;
          insert into auth.users select ('00000000-0000-0000-0000-00000000000' || c)::uuid from unnest(array['a','b','c']) c;
          update public.profiles set username = 'user' || right(id::text, 1);
          insert into public.friend_requests (from_id, to_id, accepted_at) values ('00000000-0000-0000-0000-00000000000a', '00000000-0000-0000-0000-00000000000b', now());
          insert into public.friend_requests (from_id, to_id) values ('00000000-0000-0000-0000-00000000000a', '00000000-0000-0000-0000-00000000000c');
          insert into public.daily_steps (user_id, day, steps) values ('00000000-0000-0000-0000-00000000000a', public.paris_today(), 5000), ('00000000-0000-0000-0000-00000000000b', public.paris_today(), 7000), ('00000000-0000-0000-0000-00000000000b', public.paris_today() - 3, 4000), ('00000000-0000-0000-0000-00000000000a', public.paris_today() - 3, 9000);
          -- Vieux duels : terminé il y a 1 jour (visible), en attente depuis 3 jours (caché).
          insert into public.duels (from_id, to_id, days, status, start_day, created_at) values ('00000000-0000-0000-0000-00000000000b', '00000000-0000-0000-0000-00000000000a', 3, 'active', public.paris_today() - 3, now() - interval '4 days');
          insert into public.duels (from_id, to_id, days, created_at) values ('00000000-0000-0000-0000-00000000000b', '00000000-0000-0000-0000-00000000000a', 2, now() - interval '3 days');
          set role authenticated;
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000a', false);
          select public.send_cheer('00000000-0000-0000-0000-00000000000b') as cheer1, public.send_cheer('00000000-0000-0000-0000-00000000000b') as cheer2, public.send_cheer('00000000-0000-0000-0000-00000000000c') as cheer_c;
          select public.create_duel('00000000-0000-0000-0000-00000000000b', 3) as duel1;
          select public.create_duel('00000000-0000-0000-0000-00000000000b', 3) as duel2;
          select public.create_duel('00000000-0000-0000-0000-00000000000c', 3) as duel_c;
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000b', false);
          select username, created_at is not null as ok from public.my_cheers();
          select public.mark_cheers_seen();
          select count(*) as cheers_apres from public.my_cheers();
          select other_name, incoming, status, days, start_day = public.paris_today() as today, my_steps, their_steps from public.my_duels();
          select public.respond_duel(id, true) from public.my_duels() where status = 'pending' and incoming;
          select set_config('test.uid', '00000000-0000-0000-0000-00000000000a', false);
          select other_name, incoming, status, days, start_day - public.paris_today() as debut, my_steps, their_steps from public.my_duels();
          select count(*) as duels_visibles_c from public.duels where '00000000-0000-0000-0000-00000000000c' in (from_id, to_id);
          SQL
