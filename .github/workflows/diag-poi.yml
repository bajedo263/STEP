name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/itineraire-secours
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Boucle, itinéraire et recherche avec ORS en panne
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          cat > /tmp/try.ts <<'TS'
          import { orsRoundTrip, routeThrough, searchPlaces } from './supabase/functions/_shared/routing.ts';
          import { triangleWaypoints, seedBearing } from './supabase/functions/_shared/loop.ts';
          const key = Deno.env.get('ORS_API_KEY')!;
          const start = { latitude: 48.8490, longitude: 2.2985 };
          let t = Date.now();
          const rt = await orsRoundTrip(start, 7500, 42, key);
          console.log('ORS boucle', rt ? rt.distanceM : null, Date.now() - t, 'ms');
          t = Date.now();
          const tri = await routeThrough([start, ...triangleWaypoints(start, 7500 / 1.25, seedBearing(42)), start], key);
          console.log('triangle', tri?.distanceM, tri?.durationS, tri?.coordinates.length, Date.now() - t, 'ms');
          t = Date.now();
          const ab = await routeThrough([start, { latitude: 48.8584, longitude: 2.2945 }], key);
          console.log('A→B', ab?.distanceM, Date.now() - t, 'ms');
          const places = await searchPlaces('tour eiffel', start, key);
          console.log('recherche', places?.slice(0, 3).map((p) => p.label));
          TS
          cp /tmp/try.ts ./try.ts && deno run --allow-net --allow-env ./try.ts
