name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fonction loop-route et OpenRouteService
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        continue-on-error: true
        run: |
          set +e
          set -a; . ./.env; set +a
          F=https://nkrkxmieqdkugtpsoufc.supabase.co/functions/v1
          for fn in loop-route destination pois; do
            curl -sS -m 60 -w " -> $fn %{http_code} %{time_total}s\n" -X POST "$F/$fn" -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
          done
          echo "--- DNS et connexion ORS"
          getent ahosts api.openrouteservice.org || true
          for i in 1 2 3; do curl -sS -4 -m 20 -o /dev/null -w "GET racine %{http_code} %{time_total}s\n" https://api.openrouteservice.org/ || true; sleep 5; done
          curl -sS -m 20 -o /dev/null -w "site ORS %{http_code}\n" https://openrouteservice.org/ || true
          echo "--- ORS round_trip"
          curl -sS -m 60 -o /tmp/r.json -w "%{http_code} %{time_total}s\n" -X POST https://api.openrouteservice.org/v2/directions/foot-walking/geojson \
            -H "Authorization: $ORS_API_KEY" -H "Content-Type: application/json" \
            -d '{"coordinates":[[2.2985,48.8490]],"options":{"round_trip":{"length":6000,"points":3,"seed":42}}}'
          head -c 300 /tmp/r.json; echo
          echo "--- ORS chemin par 2 points"
          curl -sS -m 60 -o /tmp/p.json -w "%{http_code} %{time_total}s\n" -X POST https://api.openrouteservice.org/v2/directions/foot-walking/geojson \
            -H "Authorization: $ORS_API_KEY" -H "Content-Type: application/json" \
            -d '{"coordinates":[[2.2985,48.8490],[2.3155,48.8553],[2.3100,48.8420],[2.2985,48.8490]]}'
          head -c 300 /tmp/p.json; echo
          curl -sS -D - -o /dev/null -X POST https://api.openrouteservice.org/v2/directions/foot-walking/geojson -H "Authorization: $ORS_API_KEY" -H "Content-Type: application/json" -d '{"coordinates":[[2.2985,48.8490],[2.30,48.85]]}' | grep -i "ratelimit\|x-ratelimit"
