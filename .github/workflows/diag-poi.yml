name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lieux-wikipedia
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lieux Wikipédia sur un quartier réel
        run: |
          cat > /tmp/try.mts <<'TS'
          import { parseWikipediaPois, wikipediaBboxParams, zoneBbox, zoneOf, zonesAround, zoneKey } from '/home/runner/work/STEP/STEP/supabase/functions/_shared/pois.ts';
          const center = { latitude: 48.8495, longitude: 2.3005 }; // départ de la boucle (15e)
          let total = 0;
          for (const zone of zonesAround(center)) {
            const t = Date.now();
            const r = await fetch('https://fr.wikipedia.org/w/api.php?' + new URLSearchParams(wikipediaBboxParams(zoneBbox(zone))), { headers: { 'User-Agent': 'STEP/1.0 (https://github.com/bajedo263/step)' } });
            const json = await r.json();
            const raw = json.query?.pages?.length ?? 0;
            const pois = parseWikipediaPois(json).filter((p) => zoneKey(zoneOf(p.coords)) === zoneKey(zone));
            total += pois.length;
            console.log(zoneKey(zone), r.status, Date.now() - t, 'ms', raw, 'articles ->', pois.length, 'lieux', json.continue ? 'CONTINUE' : '');
            for (const p of pois.slice(0, 6)) console.log('   ', p.kind, p.score, '|', p.title, '|', p.description);
          }
          console.log('total', total);
          TS
          node --experimental-strip-types /tmp/try.mts
