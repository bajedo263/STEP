name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Journaux des fonctions Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() { python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1" | curl -sS -X POST "https://api.supabase.com/v1/projects/nkrkxmieqdkugtpsoufc/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @- ; echo; }
          q "select table_name, column_name, data_type from information_schema.columns where table_schema='public' and table_name in ('pois','poi_visits') order by table_name, ordinal_position"
          q "select count(*) from public.pois"
          q "select to_regclass('supabase_migrations.schema_migrations') as t"
          q "select version, name from supabase_migrations.schema_migrations"
          q "select count(*) as walks from public.walks"
