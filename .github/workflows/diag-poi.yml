name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass et Wikipédia
        run: |
          Q='[out:json][timeout:25];(nwr["historic"](48.848,2.30,48.862,2.32););out center tags 3000;'
          for ua in "STEP (https://github.com/bajedo263/step)" "Mozilla/5.0 STEP"; do
            for u in https://overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              curl -sS -o /tmp/o.json -w "$u [$ua] %{http_code} %{time_total}s %{size_download}B\n" -m 25 -A "$ua" -H 'Accept: application/json' --data-urlencode "data=$Q" "$u" || true
              head -c 300 /tmp/o.json; echo
            done
          done
          W='https://fr.wikipedia.org/w/api.php?action=query&format=json&generator=geosearch&ggsbbox=48.862|2.30|48.848|2.32&ggslimit=500&prop=coordinates|description|info&inprop=url&colimit=max'
          curl -sS -o /tmp/w.json -w "wiki %{http_code} %{time_total}s %{size_download}B\n" -A "STEP (https://github.com/bajedo263/step)" "$W"
          python3 -c 'import json;d=json.load(open("/tmp/w.json"));p=d.get("query",{}).get("pages",{});print(len(p),"pages", "continue" in d);[print(v.get("title"),"|",v.get("description"),"|",v.get("coordinates")) for v in list(p.values())[:12]]'
