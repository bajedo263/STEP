name: Diagnostic POI
on:
  push:
    branches: ['diag/poi-logs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Services de secours
        run: |
          set +e
          curl -sS -m 20 -o /dev/null -w "ORS %{http_code}\n" https://api.openrouteservice.org/
          U='https://routing.openstreetmap.de/routed-foot/route/v1/foot/2.2985,48.8490;2.3155,48.8553;2.3100,48.8420;2.2985,48.8490?overview=full&geometries=geojson'
          curl -sS -m 30 -o /tmp/o.json -w "OSRM pied %{http_code} %{time_total}s %{size_download}B\n" -A "STEP/1.0 (https://github.com/bajedo263/step)" "$U"
          python3 -c 'import json;d=json.load(open("/tmp/o.json"));r=d["routes"][0];print(d["code"],r["distance"],r["duration"],len(r["geometry"]["coordinates"]),list(r.keys()))'
          curl -sS -m 20 -o /tmp/p.json -w "Photon %{http_code} %{time_total}s\n" -A "STEP/1.0 (https://github.com/bajedo263/step)" 'https://photon.komoot.io/api/?q=tour%20eiffel&lat=48.849&lon=2.2985&lang=fr&limit=3'
          head -c 600 /tmp/p.json; echo
